name: Pipeline Runner

on:
    schedule:
        - cron: '0 19 * * 1,2,3,4,5'   # weekdays at 19:00 UTC
    workflow_dispatch:                    # allow manual runs from GitHub UI

env:
    GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    GOOGLE_BASE_URL: ${{ secrets.GOOGLE_BASE_URL }}
    GOOGLE_MODEL: ${{ secrets.GOOGLE_MODEL }}

jobs:
    run:
        runs-on: ubuntu-latest
        timeout-minutes: 360
        steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Set up UV
          uses: astral-sh/setup-uv@v3
          with:
            version: "latest"
            python-version: "3.10"

        - name: Install dependencies
          run: uv sync --frozen

        - name: Run pipeline
          run: uv run python pipeline/run.py

        - name: Commit and push updated data
          run: |
            git config --local user.name "github-actions[bot]"
            git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add daily_data/ data/
            git diff --cached --quiet || git commit -m "chore: pipeline run $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push origin main
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
