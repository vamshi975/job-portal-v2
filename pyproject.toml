[project]
name = "job-portal-v2"
version = "0.1.0"
description = "Multi-country job portal with LLM relevance scoring and document generation"
requires-python = ">=3.10"

dependencies = [
    # Scraping
    "python-jobspy>=1.1.57",
    "requests>=2.31,<3",
    "tls-client>=1.0.1",

    # Data
    "pandas>=2.0",
    "pyarrow>=14.0",
    "numpy>=1.24",

    # Geo / language detection
    "geopy>=2.4",
    "langid>=1.1",

    # Config
    "pyyaml>=6.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.0",

    # Backend API
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",

    # LLM (OpenAI-compatible client for Gemma via Google API)
    "openai>=1.30",

    # Document generation
    "python-docx>=1.1",

    # Utilities
    "markdownify>=0.11",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["core", "pipeline", "backend"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
