[project]
name = "job-portal-v2"
version = "0.1.0"
description = "Multi-country job portal with LLM relevance scoring and document generation"
requires-python = ">=3.10"

dependencies = [
    # Scraping
    "python-jobspy>=1.1.57",
    "requests>=2.31,<3",
    "tls-client>=1.0.1",

    # Data
    "pandas>=2.0",
    "pyarrow>=14.0",
    "numpy>=1.24",

    # Geo / language detection
    "geopy>=2.4",
    "langid>=1.1",

    # Streamlit UI (legacy — replaced by Vue.js in v2; kept for pipeline reference)
    "streamlit>=1.42",
    "streamlit-dynamic-filters>=0.1.9",
    "Pillow>=10.0",
    "plotly>=5.0",

    # Utilities
    "pydantic>=2.8",
    "markdownify>=0.11",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
